<!-- Place at the VERY FIRST LINE of Card Template for Zero-Flicker Preload -->
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style id="custom-theme-style"></style>
<script>
(function() {
  var isDark = false;
  try {
    var pref = localStorage.getItem('anki_theme_preference') || sessionStorage.getItem('anki_theme_preference');
    isDark = (pref === 'dark');
  } catch(e) {
    try { isDark = (window.__anki_theme_preference === 'dark'); } catch(e2) {}
  }
  var root = document.documentElement;
  if (isDark) {
    root.classList.add('theme-dark');
    root.classList.remove('theme-green');
  } else {
    root.classList.remove('theme-dark');
    root.classList.add('theme-green');
  }
})();
</script>

<!-- Theme Toggle Button inside Header -->
<button type="button" class="emoji-btn" id="hdr-theme-btn" onclick="window.toggleCardTheme(event)" title="テーマ切替">🌙</button>

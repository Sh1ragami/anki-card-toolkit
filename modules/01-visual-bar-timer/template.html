<!-- Screen Bottom HUD: King Jim VBT20 4-Color Gradient Bar + Instant Sync -->
<div id="screen-bottom-hud">
  <div id="bottom-time-display" onclick="window.toggleSessionMenu(event)" title="タップでタイマー設定">25:00</div>
  <div id="screen-bottom-bar-track">
    <div id="screen-bottom-bar-fill"></div>
    <div id="screen-bottom-bar-ticks">
      <div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div>
    </div>
  </div>
</div>

<!-- Timer Finish Notification Banner (Deck-Harmonized Design) -->
<div id="timer-finish-toast" class="timer-finish-toast" style="display: none;">
  <div class="toast-content">
    <div class="toast-title">⏳ SESSION COMPLETE</div>
    <div class="toast-desc">セッション終了・お疲れ様でした</div>
  </div>
  <div class="toast-actions">
    <button type="button" class="toast-break-btn" onclick="window.startStudyBreak(5, event)" ontouchstart="window.startStudyBreak(5, event)">☕ 5分休憩</button>
    <button type="button" class="toast-close-btn" id="toast-close-btn" onclick="window.dismissTimerToast(event)" ontouchstart="window.dismissTimerToast(event)" title="閉じる" aria-label="閉じる">✕</button>
  </div>
</div>

<!-- Timer Setting Dropdown Panel -->
<div class="hdr-dropdown-panel" id="hdr-timer-panel" onclick="event.stopPropagation()">
  <div class="dropdown-header">
    <span>STUDY TIMER</span>
  </div>
  <button type="button" class="timer-menu-btn" onclick="window.startStudySession(15, event)">⚡ 15 分集中</button>
  <button type="button" class="timer-menu-btn" onclick="window.startStudySession(25, event)">🍅 25 分 (ポモドーロ)</button>
  <button type="button" class="timer-menu-btn" onclick="window.startStudySession(45, event)">🎯 45 分集中</button>
  <button type="button" class="timer-menu-btn" onclick="window.startStudySession(60, event)">🔥 60 分集中</button>
  <button type="button" class="timer-menu-btn" id="hdr-barmode-btn" onclick="window.toggleBarMode(event)" style="border-top: 1px dashed rgba(72, 89, 75, 0.3); margin-top: 4px; padding-top: 6px;">📊 表示: ⏳ 残り勉強時間</button>
    <!-- HUD Position Selector (Bottom, Top, Left, Right) -->
  <div class="timer-pos-bar" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(72, 89, 75, 0.25);">
    <div style="font-size: 10px; font-weight: 700; color: #48594b; margin-bottom: 4px;">📍 バー配置:</div>
    <div style="display: flex; gap: 3px;">
      <button type="button" class="hud-pos-btn" id="hud-pos-btn-bottom" onclick="window.setHudPosition('bottom', event)">下 (横)</button>
      <button type="button" class="hud-pos-btn" id="hud-pos-btn-top" onclick="window.setHudPosition('top', event)">上 (横)</button>
      <button type="button" class="hud-pos-btn" id="hud-pos-btn-left" onclick="window.setHudPosition('left', event)">左 (縦)</button>
      <button type="button" class="hud-pos-btn" id="hud-pos-btn-right" onclick="window.setHudPosition('right', event)">右 (縦)</button>
    </div>
  </div>
  <!-- HUD Thickness Selector (Thin, Normal, Thick, Huge) -->
  <div class="timer-thick-bar" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(72, 89, 75, 0.25);">
    <div style="font-size: 10px; font-weight: 700; color: #48594b; margin-bottom: 4px;">📏 バー太さ:</div>
    <div style="display: flex; gap: 3px;">
      <button type="button" class="hud-thick-btn" id="hud-thick-btn-thin" onclick="window.setHudThickness('thin', event)">細め</button>
      <button type="button" class="hud-thick-btn" id="hud-thick-btn-normal" onclick="window.setHudThickness('normal', event)">標準</button>
      <button type="button" class="hud-thick-btn" id="hud-thick-btn-thick" onclick="window.setHudThickness('thick', event)">太め</button>
      <button type="button" class="hud-thick-btn" id="hud-thick-btn-huge" onclick="window.setHudThickness('huge', event)">極太</button>
    </div>
  </div>
  <!-- Timer Alert Selector (ON / OFF) -->
  <div class="timer-alert-bar" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(72, 89, 75, 0.25);">
    <div style="font-size: 10px; font-weight: 700; color: #48594b; margin-bottom: 4px;">🔔 終了時通知:</div>
    <div style="display: flex; gap: 3px;">
      <button type="button" class="hud-alert-btn" id="hud-alert-btn-on" onclick="window.setHudAlert(true, event)">ON (表示)</button>
      <button type="button" class="hud-alert-btn" id="hud-alert-btn-off" onclick="window.setHudAlert(false, event)">OFF (なし)</button>
    </div>
  </div>
  <button type="button" class="timer-menu-btn reset" onclick="window.resetStudySession(event)">🔄 タイマーリセット</button>
</div>

<script>
/* Synchronous Instant Paint - Eliminates any card-flip flickering */
(function() {
  try {
    var endTime = parseInt(localStorage.getItem('anki_study_session_end') || '0', 10);
    var totalMs = parseInt(localStorage.getItem('anki_study_session_total') || '1500000', 10);
    var mode = localStorage.getItem('anki_bar_mode') || 'session';
    var now = Date.now();
    var remMs = Math.max(0, endTime - now);
    var remSec = Math.ceil(remMs / 1000);
    var m = Math.floor(remSec / 60);
    var s = remSec % 60;
    var timeStr = (remSec <= 0) ? '00:00' : ((m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s);

    var ratio = 0;
    if (mode === 'card') {
      ratio = 1;
    } else {
      ratio = totalMs > 0 ? (remMs / totalMs) : 0;
    }
    var pct = (Math.max(0, Math.min(1, ratio)) * 100).toFixed(2);

    var tEl = document.getElementById('bottom-time-display');
    if (tEl) tEl.textContent = timeStr;

    var hudPos = localStorage.getItem('anki_hud_position') || 'bottom';
    var hudEl = document.getElementById('screen-bottom-hud');
    if (hudEl) {
      hudEl.className = 'hud-pos-' + hudPos;
    }
    document.documentElement.classList.remove('hud-layout-top', 'hud-layout-left', 'hud-layout-right', 'hud-layout-bottom');
    document.documentElement.classList.add('hud-layout-' + hudPos);
    var hudThick = localStorage.getItem('anki_hud_thickness') || sessionStorage.getItem('anki_hud_thickness') || 'normal';
    document.documentElement.classList.remove('hud-thick-thin', 'hud-thick-normal', 'hud-thick-thick', 'hud-thick-huge');
    document.documentElement.classList.add('hud-thick-' + hudThick);
    if (hudEl) {
      hudEl.classList.remove('hud-thick-thin', 'hud-thick-normal', 'hud-thick-thick', 'hud-thick-huge');
      hudEl.classList.add('hud-thick-' + hudThick);
    }
    if (document.body) {
      document.body.classList.remove('hud-layout-top', 'hud-layout-left', 'hud-layout-right', 'hud-layout-bottom');
      document.body.classList.add('hud-layout-' + hudPos);
    }

    var fEl = document.getElementById('screen-bottom-bar-fill');
    var isVertical = (hudPos === 'left' || hudPos === 'right');
    var clip = isVertical ? ('inset(' + (100 - pct) + '% 0 0 0)') : ('inset(0 ' + (100 - pct) + '% 0 0)');
    if (fEl) {
      fEl.style.clipPath = clip;
      fEl.style.webkitClipPath = clip;
    }
    try {
      document.documentElement.style.setProperty('--bar-clip-path', clip);
    } catch(err) {}

    var alertOn = (localStorage.getItem('anki_hud_alert') || sessionStorage.getItem('anki_hud_alert')) !== 'off';
    var dismissed = localStorage.getItem('anki_timer_alert_dismissed') || sessionStorage.getItem('anki_timer_alert_dismissed') || window.__anki_timer_alert_dismissed;
    var isFinished = (endTime > 0 && remSec <= 0);
    var isDismissed = (dismissed === endTime.toString());
    if (isFinished && alertOn && !isDismissed) {
      var toast = document.getElementById('timer-finish-toast');
      if (toast) {
        toast.classList.add('show');
        toast.style.setProperty('display', 'flex', 'important');
      }
      if (tEl) tEl.classList.add('timer-finished');
    } else {
      if (tEl) tEl.classList.remove('timer-finished');
    }
  } catch(e) {}
})();
</script>
